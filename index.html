              }
            },
            {
              "@type": "Question",
              "name": "RJAYNA peut-elle créer un projet à partir de zéro ?",
              "acceptedAnswer": {
                "@type": "Answer",
                "text": "Oui. Nous pouvons partir d’une idée, d’un marché, d’un lieu ou d’une opportunité et construire l’ensemble du projet : concept, positionnement, modèle économique, stratégie, organisation, expérience client et feuille de route opérationnelle."

                "text": "RJAYNA peut intervenir à toutes les étapes : création, structuration, lancement, repositionnement, développement commercial, recherche de partenaires, expansion ou internationalisation. Notre accompagnement s’adapte au niveau de maturité et aux ambitions de chaque projet."
